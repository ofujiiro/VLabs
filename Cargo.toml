# The Cargo workspace: every part of the application is a separate crate
# under crates/. What each crate is for, and which crate may use which, is
# described in docs/architecture.md.

[workspace]
resolver = "3"
members = ["crates/*", "spikes/*", "tools/*", "xtask"]
# Plain `cargo build`, `cargo test` and `cargo run` act on the product crates.
# Spikes, tools and the developer tool (xtask) are built only when asked for by name;
# `cargo xtask ci` covers everything.
default-members = ["crates/*"]

[workspace.package]
# 0.N.0 was the build delivered at the end of roadmap phase N; 1.0.0 is v1.
# Since 1.0 (decision 0030): 1.N.0 adds features, 1.N.M only fixes. A
# release is the tag v<this version>, with notes in docs/releases/.
version = "1.0.0"
edition = "2024"
# Keep in step with rust-toolchain.toml.
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Every dependency is declared here once, then used by a crate with
# `name.workspace = true`. Before adding an outside crate, read the
# dependency rules in CLAUDE.md: the licence check will reject anything that
# is not permissively licensed.
daw-devices = { path = "crates/daw-devices" }
daw-dsp = { path = "crates/daw-dsp" }
daw-engine = { path = "crates/daw-engine" }
daw-formats = { path = "crates/daw-formats" }
daw-ident = { path = "crates/daw-ident" }
daw-model = { path = "crates/daw-model" }
daw-plugin-host = { path = "crates/daw-plugin-host" }
daw-rt = { path = "crates/daw-rt" }
daw-ui = { path = "crates/daw-ui" }

# Outside crates. Version, licence and maintenance were checked when each was
# adopted; see docs/decisions/0006-adopted-crates.md.
clack-extensions = "0.2.0"
clack-host = "0.2.0"
claxon = "0.4.3"
cpal = "0.18.2"
# The interface. Default features are off: no OFL-licensed default fonts, no
# system fonts; VLabs ships its own (decision 0008). The system clipboard
# ("clipboard") is switched on for Linux only, in the crates that use eframe:
# on Windows it would pull in a Boost-licensed crate (decision 0005).
# FLAC encoding, for tools that prepare the bundled sounds (and FLAC export,
# phase 6).
flacenc = { version = "0.5.1", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "wayland",
    "wgpu",
    "x11",
] }
egui = { version = "0.37.0", default-features = false }
# Interface tests: drives the real interface with simulated input, no window.
egui_kittest = { version = "0.37.0", default-features = false }
# Shift-JIS text, which UTAU voicebanks are written in (decision 0027).
encoding_rs = "0.8.44"
# Voicebanks' pictures: BMP, PNG and JPEG only (decision 0029).
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "jpeg",
    "png",
] }
# Ogg Vorbis decoding, for importing .ogg files.
lewton = "0.10.2"
libc = "0.2.191"
libloading = "0.9.1"
midir = "0.11.1"
# MP3 decoding, for importing .mp3 files: a safe, pure-Rust port of minimp3.
nanomp3 = "0.2.0"
# Reading DAWproject's XML (decision 0020).
quick-xml = { version = "0.42.0", default-features = false }
# Open and save dialogs: the desktop's own (Windows file dialog; on Linux the
# XDG portal through D-Bus, or zenity).
rfd = "0.18.0"
rtrb = "0.4.1"
rustysynth = "1.3.8"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
vst3 = "0.3.0"
windows-sys = "0.61.2"
x11rb = "0.14.0"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

# Lints shared by every crate. CI turns every warning into an error.
# Reasons are recorded in docs/decisions/0004-toolchain-and-quality-gates.md.
[workspace.lints.rust]
# `unsafe` is off by default. A module that truly needs it (the plugin
# bindings, for instance) opts in with `#![allow(unsafe_code, reason = "...")]`.
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they give in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Our documentation is prose full of proper nouns (SoundFont, DAWproject,
# PipeWire); this lint wants every one of them written as code.
doc_markdown = "allow"
# Stricter lints we opt in to.
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Debug builds must still be fast enough to play audio in real time, so
# dependencies are fully optimised and our own code lightly optimised.
# Debug assertions (including the audio-thread checks) stay on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
