[package]
name = "spike-plugin-host"
description = "Phase 0 spike: load a CLAP and a VST3 instrument, play notes, open its editor, save and restore its state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clack-host.workspace = true
clack-extensions = { workspace = true, features = [
    "clack-host",
    "audio-ports",
    "gui",
    "log",
    "note-ports",
    "params",
    "posix-fd",
    "state",
    "timer",
] }
libloading.workspace = true
vst3.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
