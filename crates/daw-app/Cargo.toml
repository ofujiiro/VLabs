[package]
name = "daw-app"
description = "The program people launch: starts the engine and the interface and connects them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
daw-devices.workspace = true
daw-engine.workspace = true
daw-formats.workspace = true
daw-ident.workspace = true
daw-model.workspace = true
daw-rt.workspace = true
daw-ui.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The system clipboard, on Linux only (decision 0005).
eframe = { workspace = true, features = ["clipboard"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse"] }
