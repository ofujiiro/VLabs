[package]
name = "daw-plugin-host"
description = "Loading and running third-party CLAP and VST3 plugins."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clack-host.workspace = true
clack-extensions = { workspace = true, features = [
    "clack-host",
    "audio-ports",
    "gui",
    "log",
    "note-ports",
    "params",
    "posix-fd",
    "state",
    "timer",
] }
daw-rt.workspace = true
libloading.workspace = true
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
vst3.workspace = true
# Opening downloaded plugin archives (decision 0023).
zip.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
x11rb.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
