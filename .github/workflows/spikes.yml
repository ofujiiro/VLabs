# Phase 0 risk spikes and, later, integration tests that need things the
# main CI job does not have: a virtual sound card, a virtual screen, and
# downloaded reference plugins. Results are printed in the log and uploaded
# as artifacts.

name: Spikes

on:
  push:
    branches: [main]
    paths:
      - "spikes/**"
      - "crates/daw-rt/**"
      - ".github/workflows/spikes.yml"
      - ".github/scripts/**"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  audio-latency:
    name: Audio output (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux libraries and a virtual sound card (PipeWire)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev \
            pipewire pipewire-alsa pipewire-jack wireplumber dbus
          .github/scripts/start-virtual-audio.sh

      # Windows runners have no sound device; this installs a virtual one.
      - name: Install a virtual sound card (Windows)
        if: runner.os == 'Windows'
        uses: LABSN/sound-ci-helpers@e9d6ba52163a3283714a68412036ddf33f78d49c # main, 2024

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: spikes

      # A debug build, so the audio-thread allocation check is active.
      - name: Build
        run: cargo build -p spike-audio-latency --locked

      - name: Measure (smallest buffer the system accepts)
        run: cargo run -p spike-audio-latency --locked -- --seconds 6 --list

      - name: Measure (256-frame buffer)
        run: cargo run -p spike-audio-latency --locked -- --seconds 4 --buffer 256

  plugin-host:
    name: Plugin hosting (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SURGE_VERSION: "1.3.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux libraries and a virtual screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb \
            libasound2-dev libx11-6 libxext6 libxrender1 libxinerama1 libxrandr2 \
            libxcursor1 libfreetype6 libfontconfig1

      # Surge XT is a test fixture only: downloaded here, never linked or bundled.
      - name: Download Surge XT (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p fixtures
          curl -sSfL -o surge.tar.gz "https://github.com/surge-synthesizer/releases-xt/releases/download/${SURGE_VERSION}/surge-xt-linux-${SURGE_VERSION}-pluginsonly.tar.gz"
          tar -xzf surge.tar.gz -C fixtures
          ls -la fixtures

      - name: Download Surge XT (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force fixtures | Out-Null
          Invoke-WebRequest -Uri "https://github.com/surge-synthesizer/releases-xt/releases/download/$env:SURGE_VERSION/surge-xt-win64-$env:SURGE_VERSION-pluginsonly.zip" -OutFile surge.zip
          Expand-Archive surge.zip -DestinationPath fixtures-raw
          Get-ChildItem -Recurse -Depth 3 fixtures-raw | Select-Object FullName
          $clap = Get-ChildItem -Recurse fixtures-raw -Filter "Surge XT.clap" | Select-Object -First 1
          $vst3 = Get-ChildItem -Recurse fixtures-raw -Filter "Surge XT.vst3" -Directory | Select-Object -First 1
          Copy-Item $clap.FullName fixtures/
          Copy-Item -Recurse $vst3.FullName fixtures/
          Get-ChildItem fixtures

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: spikes

      - name: Build
        run: cargo build -p spike-plugin-host --locked

      - name: CLAP (Linux, virtual X11 screen)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" target/debug/spike-plugin-host "fixtures/Surge XT.clap" --editor 5 --out spike-output

      - name: VST3 (Linux, virtual X11 screen)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1200x24" target/debug/spike-plugin-host "fixtures/Surge XT.vst3" --editor 5 --out spike-output

      - name: CLAP (Windows)
        if: runner.os == 'Windows'
        run: target\debug\spike-plugin-host.exe "fixtures\Surge XT.clap" --editor 5 --out spike-output

      - name: VST3 (Windows)
        if: runner.os == 'Windows'
        run: target\debug\spike-plugin-host.exe "fixtures\Surge XT.vst3" --editor 5 --out spike-output

      - name: Keep the renders and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-host-${{ matrix.name }}
          path: spike-output
          if-no-files-found: ignore

  piano-roll:
    name: Piano roll (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: Windows
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux libraries, a virtual screen and software graphics
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libegl1 libgl1 \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: spikes

      - name: Build
        run: cargo build -p spike-piano-roll --locked

      # Frame build and tessellation time, without a window, through egui's
      # real input path. Fails if the slowest 5% of frames exceed the budget.
      - name: Benchmark (10,000 notes)
        run: cargo run -p spike-piano-roll --locked -- --bench

      # The real window, drawn by wgpu. CI machines have no GPU, so this uses
      # software rendering: it proves the pipeline works, not GPU speed.
      - name: Window with autopilot (Linux, virtual screen)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" cargo run -p spike-piano-roll --locked -- --autopilot 6 --screenshot piano-roll.bmp

      - name: Window with autopilot (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo run -p spike-piano-roll --locked -- --autopilot 6 --screenshot piano-roll.bmp

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piano-roll-${{ matrix.name }}
          path: piano-roll.bmp
          if-no-files-found: ignore
