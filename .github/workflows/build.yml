# Builds the program for people to try, attached to the run's page as
# downloadable files: the Windows installer and release folder, the Linux
# AppImage and release folder (decision 0022).
#
# It runs by hand (Actions › Program builds › Run workflow) or when a
# `milestone-*` tag is pushed, so CI minutes are spent on milestone builds,
# not on every change (CI already builds and tests every change).
#
# A tag `v<version>` (or a run by hand given that tag) also publishes the
# builds as a GitHub release, with the notes in docs/releases/ (decision
# 0030).

name: Program builds

on:
  workflow_dispatch:
    inputs:
      release:
        description: "To publish a release, its tag: v and the workspace's version (v1.0.0). Empty for a test build."
        required: false
        default: ""
  push:
    tags: ["milestone-*", "v*"]

concurrency:
  group: program-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Ubuntu 26.04)
            os: ubuntu-26.04
            artifact: program-linux
          - name: Windows (Server 2025)
            os: windows-2025
            artifact: program-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Install Rust (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Release build (cargo xtask dist)
        run: cargo xtask dist

      # Artifacts lose the "executable" permission of Linux files, so the
      # Linux build is packed in a tar archive, which keeps it.
      - name: Pack the Linux build
        if: runner.os == 'Linux'
        run: tar -czf program-linux.tar.gz -C dist .

      - name: Upload the Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: program-linux.tar.gz
          retention-days: 30

      - name: Upload the Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

      # The Windows installer (decision 0022): NSIS, for the current user.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Make the Windows installer (cargo xtask installer)
        if: runner.os == 'Windows'
        env:
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
        run: cargo xtask installer

      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: dist-installer/*-setup.exe
          retention-days: 30

  # The Linux AppImage (decision 0022), built on the oldest current Ubuntu
  # LTS so it runs on systems with glibc 2.39 or newer.
  appimage:
    name: Linux AppImage (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Install Rust (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Release build (cargo xtask dist)
        run: cargo xtask dist

      - name: Get appimagetool 1.9.1 (checksum checked)
        run: |
          curl -sSfL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool

      - name: Make the AppImage (cargo xtask appimage)
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
        run: cargo xtask appimage

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-linux
          path: dist-installer/*.AppImage
          retention-days: 30

  # The release (decision 0030): the files above on the repository's
  # Releases page, with the notes in docs/releases/<tag>.md (its first line
  # is the title). The tag must name the workspace's version.
  release:
    name: Publish the release
    needs: [build, appimage]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against the version and the notes
        run: |
          version="$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG is not v and the workspace's version ($version)."
            exit 1
          fi
          if [ ! -f "docs/releases/$TAG.md" ]; then
            echo "::error::The release notes docs/releases/$TAG.md are missing."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # The plain folders are packed with a folder of their own inside
      # (named like the installer), so unpacking them makes one folder.
      - name: Gather the files
        run: |
          mkdir release staging
          cp artifacts/installer-windows/*-setup.exe release/
          cp artifacts/appimage-linux/*.AppImage release/
          name="$(basename release/*-setup.exe -setup.exe)"
          cp -r artifacts/program-windows "staging/$name"
          python3 -c 'import shutil, sys; shutil.make_archive(sys.argv[1], "zip", sys.argv[2], sys.argv[3])' \
            "release/$name-windows" staging "$name"
          rm -r "staging/$name"
          mkdir "staging/$name"
          tar -xzf artifacts/program-linux/program-linux.tar.gz -C "staging/$name"
          tar -czf "release/$name-linux.tar.gz" -C staging "$name"
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          ls -l release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$TAG.md"
          title="$(head -n 1 "$notes" | sed 's/^# *//')"
          tail -n +2 "$notes" > release-notes.md
          gh release create "$TAG" release/* --title "$title" \
            --notes-file release-notes.md --target "$GITHUB_SHA"
